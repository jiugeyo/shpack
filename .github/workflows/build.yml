name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub 网页上传会丢掉 +x，先兜底恢复
      - name: 修复可执行位
        run: bash fix-perms.sh || true

      - name: 安装交叉编译器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu

      - name: 构建 packer + stub（x86_64 / aarch64）
        run: |
          make -j"$(nproc)"
          make ARCH=aarch64 -j"$(nproc)"

      - name: 获取静态 bash/busybox
        run: |
          bash scripts/fetch-static.sh --arch x86_64 --out runtime/x86_64
          bash scripts/fetch-static.sh --arch aarch64 --out runtime/aarch64

      - name: 端到端测试
        run: bash tests/run-tests.sh

      - name: 打包示例
        run: |
          bash pack.sh -s examples/hello.sh -o dist/hello --compress lz4
          bash pack.sh --arch aarch64 -s examples/hello.sh -o dist/hello-arm64 --compress lz4
          (cd dist && sha256sum hello hello-arm64 > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: shpack-binaries
          path: dist/
          if-no-files-found: error
