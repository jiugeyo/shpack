name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 修复可执行位
        run: bash fix-perms.sh || true

      - name: 安装 aarch64 交叉编译器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu

      - name: 构建与测试
        run: |
          make -j"$(nproc)"
          bash scripts/make-builder.sh --arches "x86_64 aarch64 armv7 i386" --aarch64-host
          mkdir -p runtime/x86_64
          cp prebuilt/x86_64/bash prebuilt/x86_64/busybox runtime/x86_64/
          bash tests/run-tests.sh
          bash tests/builder-tests.sh

      - name: 打包示例
        run: |
          ./dist/shpack-builder -s examples/hello.sh -o dist/hello -a x86_64 --compress lz4
          ./dist/shpack-builder -s examples/hello.sh -o dist/hello-arm64 -a aarch64 --compress lz4
          # 兼容旧下载名（用户习惯 ./shpack-aarch64.sh）
          cp dist/shpack-builder dist/shpack-X86_64.sh
          cp dist/shpack-builder-aarch64 dist/shpack-aarch64.sh
          chmod 755 dist/shpack-X86_64.sh dist/shpack-aarch64.sh
          (cd dist && sha256sum hello hello-arm64 shpack-builder shpack-builder-aarch64 \
             shpack-X86_64.sh shpack-aarch64.sh > SHA256SUMS)

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shpack-builder
            dist/shpack-builder-aarch64
            dist/shpack-X86_64.sh
            dist/shpack-aarch64.sh
            dist/hello
            dist/hello-arm64
            dist/SHA256SUMS
          generate_release_notes: true
